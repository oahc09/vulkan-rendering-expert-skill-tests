[pytest]
cache_dir = .pytest_cache
markers =
    static: deterministic source, structure, and harness tests (no inference)
    snapshot: historical checked-in responses (not current-model evidence)
    live: provenance-checked newly generated model responses (skip without run)
    host_unit: CPU-only contract/reference tests, not shader or GPU execution
    shader_unit: actual shader compilation/validation and artifact tests
    vulkan_integration: actual Vulkan draw/dispatch experiment, not mobile performance
    mobile_scale: target mobile hardware/scale execution only
