name: Vulkan Skill Static and Snapshot
on:
  push:
    branches: [main, 'feat/v1.0.11-*', 'feat/v1.0.13-*', 'feat/v1.0.14-*', 'feat/v1.0.15-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          path: tests
          persist-credentials: false
      - name: Resolve reviewed paired candidate (no fallback)
        id: candidate
        run: |
          python - <<'PYCODE'
          import json, os, re
          c = json.load(open('tests/release-contract.json'))
          assert re.fullmatch('[0-9a-f]{40}', c['skill_sha']), 'Reviewed full SHA required'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + c['skill_sha'] + '\n')
          PYCODE
      - name: Checkout paired skill revision
        uses: actions/checkout@v4
        with:
          repository: oahc09/vulkan-rendering-expert-skill
          ref: ${{ steps.candidate.outputs.sha }}
          path: skill
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact revisions
        run: |
          git -C tests rev-parse HEAD
          git -C skill rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skill source and safety contracts (same pinned candidate)
        working-directory: skill
        run: |
          node scripts/check-skill.mjs
          python scripts/host_contract.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Static
        run: python -m pytest -q -m static tests/tests
      - name: Host Unit (CPU contracts, not GPU execution)
        run: python -m pytest -q -m host_unit tests/tests
      - name: Snapshot (historical v1.0.8, not live evidence)
        run: python -m pytest -q -m snapshot tests/tests
      - name: Live availability (no model credentials in PR jobs)
        run: python tests/tests/run_live_model_behavior.py --output-dir /tmp/vulkan-live-status
